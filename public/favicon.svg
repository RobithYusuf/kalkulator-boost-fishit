<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>

  <!-- Fish Icon -->
  <path d="M 30 50 Q 35 40, 50 45 Q 65 40, 70 50 Q 65 60, 50 55 Q 35 60, 30 50 Z" fill="white" opacity="0.9"/>
  <circle cx="60" cy="47" r="3" fill="#1f1f33"/>

  <!-- Calculator Grid -->
  <rect x="35" y="60" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
  <rect x="46" y="60" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
  <rect x="57" y="60" width="8" height="8" rx="1" fill="white" opacity="0.8"/>

  <!-- Money Symbol -->
  <text x="50" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">₱</text>
